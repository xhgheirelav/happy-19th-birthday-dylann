<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double Happiness 💗</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#fff1f5,#ffd1e2,#f8b7d0);
  color: #713b52;
  overflow: hidden;
}

.card {
  width: min(100%, 500px);
  padding: 35px 22px;
  border-radius: 28px;
  background: white;
  box-shadow: 0 15px 40px #b66a8730;
  text-align: center;
}

h1 { font-size: 36px; }
p { font-size: 18px; line-height: 1.6; }

.buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  min-height: 65px;
}

button {
  border: none;
  border-radius: 30px;
  padding: 14px 28px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  touch-action: none;
}

#yes {
  background: #e66b9b;
  color: white;
}

#no {
  background: #ffe3ed;
  color: #a64c72;
}

#details {
  display: none;
  animation: pop .4s ease;
}

.detail-box {
  background: #fff0f5;
  padding: 20px;
  border-radius: 20px;
  margin-top: 20px;
  line-height: 2;
}

.label {
  display: block;
  font-size: 12px;
  letter-spacing: 2px;
  color: #b36a88;
  font-weight: bold;
}

@keyframes pop {
  from { opacity: 0; transform: scale(.9); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>
<div class="card">

<section id="invite">
  <div style="font-size:32px">♡ 💗 ♡</div>
  <h1>Hey boyfriend!</h1>
  <p>Would you come and receive your
  <b>double happiness</b> tomorrow? 🥰</p>

  <div class="buttons">
    <button id="yes">YES! 💗</button>
    <button id="no">NO 🙄</button>
  </div>

  <p style="font-size:13px">Choose wisely… hehe 🤭</p>
</section>

<section id="details">
  <div style="font-size:35px">🎉 💗 🎉</div>
  <h1>YAYYYY! 🥳</h1>
  <p>Your double happiness date is confirmed!</p>

  <div class="detail-box">
    <span class="label">DATE</span>
    4 November 2026

    <span class="label">TIME</span>
    8:30 AM

    <span class="label">PLACE</span>
    Wifey's house 🏡
  </div>

  <p>Can't wait to see you! 💕</p>
</section>

</div>

<script>
const yes = document.getElementById("yes");
const no = document.getElementById("no");

function moveNo() {
  const rect = no.getBoundingClientRect();
  const padding = 15;

  const maxX = window.innerWidth - rect.width - padding;
  const maxY = window.innerHeight - rect.height - padding;

  no.style.position = "fixed";
  no.style.left =
    Math.max(padding, Math.random() * maxX) + "px";
  no.style.top =
    Math.max(padding, Math.random() * maxY) + "px";
}

no.addEventListener("pointerenter", e => {
  if (e.pointerType === "mouse") moveNo();
});

no.addEventListener("pointerdown", e => {
  e.preventDefault();
  moveNo();
});

no.addEventListener("click", e => {
  e.preventDefault();
  moveNo();
});

yes.addEventListener("click", () => {
  document.getElementById("invite").style.display = "none";
  document.getElementById("details").style.display = "block";
});
</script>

</body>
</html>
